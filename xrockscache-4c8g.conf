# XRocksCache 4C8G profile / XRocksCache 4C8G 配置
# Use this profile for larger capacity sweeps after the 2C4G baseline is stable.
# 2C4G 基线稳定后，可使用该配置做更大容量探测。
xrockscache-profile yes

# Product invariants:
# key <= 512KiB, value <= 1MiB, write TTL <= 15 days.
# 产品硬约束：
# key 不超过 512KiB，value 不超过 1MiB，写入 TTL 不超过 15 天。
bind 127.0.0.1
port 6666
workers 4
maxclients 4096

dir data
log-dir stdout
log-level info
log-format text
log-retention-days 15

# Active expiration cleaner.
# 主动过期清理器。
#
# 4C8G keeps the same 30s bucket precision, but allows a larger per-cycle
# delete budget than 2C4G. Read commands still guarantee expired keys are not visible.
# 4C8G 保持相同的 30 秒桶精度，但允许每轮删除更多 key。
# 读命令仍然保证过期 key 不可见。
active-expire-enabled yes
active-expire-bucket-seconds 30
active-expire-interval-seconds 10
active-expire-cycle-budget-ms 20
active-expire-max-deletes-per-cycle 3000

# Optional password. Uncomment to enable AUTH.
# 可选密码。取消注释后启用 AUTH。
# requirepass change-me
