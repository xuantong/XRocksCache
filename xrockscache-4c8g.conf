# XRocksCache 4C8G 配置
# 上线基线：阿里云 ESSD PL1；不接受 PL0。
disk-type cloud_essd
disk-pl pl1
disk-capacity-gib 100
#
# 该配置用于 4C8G 机器的服务入口参数。RocksDB 内部参数不在这里配置，
# 程序会根据 CPU、内存和数据盘剩余空间自动计算，避免使用者被底层细节干扰。

xrockscache-profile yes

# 产品硬约束：
# key 不超过 512KiB，value 不超过 5MiB，写入 TTL 不超过 15 天。
bind 127.0.0.1
port 6666
workers 4
maxclients 4096

# 数据目录。RocksDB 生产构建会把数据放在 <dir>/rocksdb 下。
dir data
write-rate-mib 35

# 运行日志。
log-dir stdout
log-level info
log-format text
log-retention-days 15

# 可选密码。取消注释后启用 AUTH。
# requirepass change-me
