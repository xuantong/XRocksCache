# XRocksCache 4c8g profile / XRocksCache 4c8g 配置
# Use this profile for larger capacity sweeps after the 2c4g baseline is stable.
# 在 2c4g 基线稳定后，用该配置做更大容量探测。

xrockscache-profile yes

# Product invariants enforced by the profile:
# key <= 512KiB, value <= 1MiB, write TTL <= 15 days.
# 产品边界由 profile 强制：
# key 不超过 512KiB，value 不超过 1MiB，写入 TTL 不超过 15 天。

bind 127.0.0.1
port 6666
workers 4
maxclients 2048

dir /data/xrockscache
pidfile /data/xrockscache/xrockscache.pid
log-dir stdout
db-name xrockscache

# Capacity ceiling should match the test disk. Stop before filesystem usage reaches 80%.
# 容量上限需要按测试磁盘调整。文件系统使用率到 80% 前应停止压测。
max-db-size 700

cluster-enabled no
redis-databases 0
repl-namespace-enabled no
txn-context-enabled no

rocksdb.block_cache_size 2048
rocksdb.write_buffer_size 32
rocksdb.max_write_buffer_number 4
rocksdb.max_total_wal_size 512
rocksdb.max_open_files 4096

rocksdb.max_background_jobs 4
rocksdb.max_background_compactions 2
rocksdb.max_background_flushes 1
rocksdb.max_subcompactions 2

rocksdb.cache_index_and_filter_blocks yes
rocksdb.compression snappy
rocksdb.wal_ttl_seconds 0
rocksdb.wal_size_limit_mb 2048
rocksdb.write_options.disable_wal no
rocksdb.write_options.sync no
