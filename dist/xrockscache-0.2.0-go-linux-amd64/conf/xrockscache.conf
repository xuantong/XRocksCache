# XRocksCache 2C4G 配置
#
# 该配置只保留用户需要理解的业务参数。生产构建使用 RocksDB，底层的
# block cache、write buffer、SST 文件大小、blob 文件大小、compaction
# 阈值和磁盘水位线会根据 CPU、内存和数据盘剩余空间自动计算。

xrockscache-profile yes

# 产品硬约束：
# key 不超过 512KiB，value 不超过 1MiB，写入 TTL 不超过 15 天。
bind 127.0.0.1
port 6666
workers 2
maxclients 1024

# 数据目录。RocksDB 生产构建会把数据放在 <dir>/rocksdb 下。
# 未带 -tags rocksdb 的兼容构建可能创建应用层 AOF，仅用于本地开发。
dir data

# 运行日志。
log-dir stdout
log-level info
log-format text
log-retention-days 15

# 可选密码。取消注释后启用 AUTH。
# requirepass change-me
