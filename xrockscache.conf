# XRocksCache 2c4g profile / XRocksCache 2c4g 配置
# Conservative starting point; benchmark on the real host before production.
# 保守起步配置；生产前必须在真实机器上压测。

xrockscache-profile yes

# Product invariants enforced by the profile:
# key <= 512KiB, value <= 1MiB, write TTL <= 15 days.
# 产品边界由 profile 强制：
# key 不超过 512KiB，value 不超过 1MiB，写入 TTL 不超过 15 天。

bind 127.0.0.1
port 6666
workers 2
maxclients 1024

dir /data/xrockscache
pidfile /data/xrockscache/xrockscache.pid
log-dir stdout
db-name xrockscache

# Target volume: 100GiB. Keep about 30GiB outside the SST limit for WAL,
# compaction overlap, logs, and filesystem headroom.
# 目标盘：100GiB。预留约 30GiB 给 WAL、compaction 临时重叠、日志和文件系统余量。
max-db-size 70

cluster-enabled no
redis-databases 0
repl-namespace-enabled no
txn-context-enabled no

# Bound the largest RocksDB memory consumers. Values are MiB unless the option states otherwise.
# 限制主要 RocksDB 内存消耗项。除非配置项另有说明，单位均为 MiB。
rocksdb.block_cache_size 768
rocksdb.write_buffer_size 16
rocksdb.max_write_buffer_number 2
rocksdb.max_total_wal_size 256
rocksdb.max_open_files 2048

# Keep background storage work within the two-core CPU budget.
# 将后台存储任务限制在双核预算内。
rocksdb.max_background_jobs 2
rocksdb.max_background_compactions 1
rocksdb.max_background_flushes 1
rocksdb.max_subcompactions 1

rocksdb.cache_index_and_filter_blocks yes
rocksdb.compression snappy
rocksdb.wal_ttl_seconds 0
rocksdb.wal_size_limit_mb 1024
rocksdb.write_options.disable_wal no
rocksdb.write_options.sync no
