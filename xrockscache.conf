# XRocksCache 2C4G profile / XRocksCache 2C4G 配置
# This Go profile keeps runtime overhead small and deployment simple.
# 该 Go 版配置优先保证运行时开销小、部署简单。
xrockscache-profile yes

# Product invariants:
# key <= 512KiB, value <= 1MiB, write TTL <= 15 days.
# 产品硬约束：
# key 不超过 512KiB，value 不超过 1MiB，写入 TTL 不超过 15 天。
bind 127.0.0.1
port 6666
workers 2
maxclients 1024

# Append-only data directory.
# 追加日志数据目录。
dir data

# Runtime logging.
# 运行日志。
log-dir stdout
log-level info
log-format text
log-retention-days 15

# Daily log rotation is enabled when log-dir points to a directory.
# stdout/stderr mode delegates rotation to containers, systemd, or cloud logging agents.
# 当 log-dir 指向目录时启用按天日志切换。
# stdout/stderr 模式由容器、systemd 或云日志 Agent 负责轮转。

# Active expiration cleaner.
# 主动过期清理器。
#
# Expiration visibility is still guaranteed by the read path. The background
# cleaner only reclaims memory and persists DEL tombstones for expired keys.
# 过期不可见仍由读路径保证；后台清理器只负责释放内存，并为过期 key 持久化 DEL 删除记录。
active-expire-enabled yes
active-expire-bucket-seconds 30
active-expire-interval-seconds 10
active-expire-cycle-budget-ms 10
active-expire-max-deletes-per-cycle 1000

# Optional password. Uncomment to enable AUTH.
# 可选密码。取消注释后启用 AUTH。
# requirepass change-me
